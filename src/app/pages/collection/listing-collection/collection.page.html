<ion-content>
  <div class="searchbar_collection">
    <ion-searchbar
      color="light"
      show-clear-button="never"
      placeholder="찾고 싶은 컬렉션을 검색하세요!"
    ></ion-searchbar>
  </div>

  <div class="hot">인기🔥</div>

  <section
    *ngIf="collectionLoadStatus === 'loading'"
    aria-label="컬렉션을 불러오는 중"
  >
    <article *ngFor="let item of skeletonItems" class="collection-skeleton">
      <div class="collection-skeleton-header">
        <ion-skeleton-text animated class="avatar-skeleton"></ion-skeleton-text>
        <ion-skeleton-text
          animated
          class="collection-title-skeleton"
        ></ion-skeleton-text>
      </div>
      <div class="collection-skeleton-posters">
        <ion-skeleton-text
          animated
          class="collection-poster-skeleton"
        ></ion-skeleton-text>
        <ion-skeleton-text
          animated
          class="collection-poster-skeleton"
        ></ion-skeleton-text>
        <ion-skeleton-text
          animated
          class="collection-poster-skeleton"
        ></ion-skeleton-text>
      </div>
    </article>
  </section>

  <section
    *ngIf="collectionLoadStatus === 'error'"
    class="collection-state-message"
    aria-live="polite"
  >
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ collectionLoadError }}</p>
    <ion-button fill="outline" (click)="retryCollections()"
      >다시 시도</ion-button
    >
  </section>

  <section
    *ngIf="collectionLoadStatus === 'empty'"
    class="collection-state-message"
    aria-live="polite"
  >
    <ion-icon name="albums-outline"></ion-icon>
    <p>표시할 컬렉션이 없습니다.</p>
  </section>

  <section *ngIf="collectionLoadStatus === 'success'">
    <article *ngFor="let collection of collections" class="christmas_movie">
      <div class="header">
        <img
          class="unknow-image"
          src="assets/images/unknown.png"
          alt="사용자 프로필"
        />
        <p>{{ collection.name }}</p>
        <ion-icon
          class="arrow-icon"
          name="chevron-forward-outline"
          (click)="goToDetailCollectionPage(collection.id)"
        ></ion-icon>
      </div>

      <div class="poster-row" (click)="viewDetail(collection.id)">
        <img
          *ngFor="let movie of collection.movies"
          [src]="movie.posterUrl"
          [alt]="movie.title + ' 포스터'"
          class="poster-image"
        />
      </div>

      <div class="likes">
        <ion-icon name="heart"></ion-icon>
        <span>{{ collection.favoriteCount }}</span>
      </div>
    </article>
  </section>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon (click)="goToUploadCollectionPage()" name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
